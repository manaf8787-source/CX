<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSI CX Setup</title>
<style>
:root{--ink:#16212e;--mut:#5b6775;--line:#e3e7ec;--bg:#f5f7fa;--card:#fff;--navy:#12385b;--gold:#c8963e;--bad:#b42318;--ok:#1f7a4d;--warn:#b26a00;--soft:#eef2f7}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
[dir=rtl]{font-family:"Noto Naskh Arabic",Tahoma,Arial,sans-serif}
.top{background:var(--navy);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top b{font-size:17px}.top .sp{flex:1}
.top button,.top a{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none}
.top button.on{background:#fff;color:var(--navy);border-color:#fff}
main{max-width:900px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:22px 0 8px}h3{font-size:15px;margin:0 0 4px}
.lead{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>.g{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.s{padding:4px 9px;font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mut)}
.tag.bad{background:#fde8e6;color:var(--bad)}.tag.ok{background:#e3f3ea;color:var(--ok)}.tag.warn{background:#fff1dc;color:var(--warn)}
.mut{color:var(--mut)}.sm{font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
textarea{min-height:60px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:start;font-size:12px;color:var(--mut);padding:6px 8px;border-bottom:1px solid var(--line)}td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.q{border-top:1px dashed var(--line);padding:8px 0}
.prev{background:var(--navy);color:#fff;border-radius:14px;padding:16px;max-width:360px}
.prev .b{background:#fff;color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px}
.why{font-size:13px;color:var(--navy);cursor:pointer;border:0;background:none;padding:0;text-decoration:underline}
.whybox{background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:14px}
</style>
</head>

    '<div><div class="mut sm" style="margin-bottom:6px">'+esc(T('What the customer receives','ما يصله الزبون'))+'</div><div class="prev"><div class="sm" style="opacity:.8">PSI · '+esc(L(CHN[x.ch]))+'</div>'+x.q.map(function(q,i){var k=x.id+'|'+i;return '<div class="b">'+esc(val(k+'|'+S.lang,q.t[S.lang]))+'<div class="mut sm">'+esc(typeof q.k==='string'?q.k:L(q.k))+'</div></div>'}).join('')+'</div></div></div>'}
   h+='</div>'})});
 h+=why('sv',esc(T('Decision 5: ask only after something meaningful, one question set per touchpoint, never on a public channel, never more than the caps; CES for a task the customer did, CSAT for a human interaction, NPS for the relationship after a milestone. Low scores open "What went wrong?" and put the person on the call list.','القرار 5: نسأل فقط بعد شيء ذي معنى، مجموعة واحدة لكل نقطة تماس، لا على قناة عامة أبداً، ولا أكثر من الأسقف؛ CES لمهمة قام بها الزبون، CSAT لتفاعل بشري، NPS للعلاقة بعد إنجاز. الدرجات المنخفضة تفتح "ما الذي حدث؟" وتضع الشخص على قائمة الاتصال.')));return h}
function vScripts(){var h='<h1>'+esc(T('AI caller scripts','سكربتات متصل الذكاء'))+'</h1><p class="lead">'+esc(T('What the AI says, in order, when the CX team sends a customer to it. The hand-off rules are fixed; the questions are yours.','ما يقوله الذكاء بالترتيب عندما يرسل له فريق CX زبوناً. قواعد الإحالة ثابتة؛ والأسئلة لك.'))+'</p>';
 SCRIPTS.forEach(function(x){var open=S.sel===x.id;h+='<div class="card"><div class="row"><div class="g"><h3>'+esc(L(x.n))+'</h3><div class="mut sm">'+esc(L(x.open))+'</div></div><button class="btn s" data-sel="'+x.id+'">'+esc(open?T('Close','أغلق'):T('Edit','عدّل'))+'</button></div>';
  if(open)h+='<div style="margin-top:8px">'+x.q.map(function(q,i){var k=x.id+'|'+i;return '<div class="q"><label>'+esc(T('Question','السؤال')+' '+(i+1))+'</label><input data-ed="'+k+'|en" value="'+esc(val(k+'|en',q.en))+'"><input style="margin-top:4px" dir="rtl" data-ed="'+k+'|ar" value="'+esc(val(k+'|ar',q.ar))+'"></div>'}).join('')+'<div class="row" style="margin-top:10px"><button class="btn p" data-save="'+x.id+'">'+esc(T('Save','احفظ'))+'</button></div></div>';h+='</div>'});
 h+='<div class="card"><h3>'+esc(T('Hand-off rules (fixed)','قواعد الإحالة (ثابتة)'))+'</h3>'+HANDOFF.map(function(r){return '<div>• '+esc(L(r))+'</div>'}).join('')+'<div class="mut sm" style="margin-top:6px">'+esc(T('Every AI call returns through the call API: answers, reason code, outcome, duration, recording link; it lands on the customer\'s timeline like any other call.','كل مكالمة ذكاء تعود عبر واجهة المكالمات: الإجابات، رمز السبب، النتيجة، المدة، رابط التسجيل؛ وتستقر على الخط الزمني للزبون كأي مكالمة.'))+'</div></div>';return h}
function vShopper(){var h='<h1>'+esc(T('Mystery shopper','المتسوق الخفي'))+'</h1><p class="lead">'+esc(T('What the shopper checks, the two scenarios, and who visits where. Results come back through the Shopper page: critical opens a case the same day, medium is a signal, low is an L&D statistic.','ما يفحصه المتسوق، السيناريوهان، ومن يزور أين. تعود النتائج عبر صفحة المتسوق: الحرج يفتح حالة في اليوم نفسه، المتوسط إشارة، المنخفض إحصائية لـ L&D.'))+'</p>';
 h+='<h2>'+esc(T('Checklist','قائمة الفحص'))+' <span class="tag">'+CHECK.reduce(function(a,c){return a+c.items.length},0)+' '+esc(T('items','بنداً'))+'</span></h2>';

 h+='<h2>'+esc(T('Visits','الزيارات'))+'</h2><div class="card"><table><tr><th>'+esc(T('Date','التاريخ'))+'</th><th>'+esc(T('Place','المكان'))+'</th><th>'+esc(T('Scenario','السيناريو'))+'</th><th>'+esc(T('Shopper','المتسوق'))+'</th><th>'+esc(T('Status','الحالة'))+'</th></tr>'+VISITS.map(function(v){var sc=SCEN.filter(function(s){return s.id===v.sc})[0];return '<tr><td>'+v.d+'</td><td>'+esc(L(v.place))+'</td><td>'+esc(L(sc.n))+'</td><td>'+esc(v.who)+'</td><td><span class="tag '+(v.st==='reviewed'?'ok':v.st==='sent'?'warn':'')+'">'+esc({reviewed:T('reviewed · ','رُوجعت · ')+v.score+'%',sent:T('sent to the shopper','أُرسلت للمتسوق'),draft:T('draft','مسودة')}[v.st])+'</span></td></tr>'}).join('')+'</table><div class="row" style="margin-top:10px"><button class="btn p" data-act="newvisit">'+esc(T('Plan a visit','خطّط زيارة'))+'</button><span class="mut sm">'+esc(T('Shoppers get a private link by WhatsApp or email; they see only their own tasks.','يحصل المتسوقون على رابط خاص بواتساب أو بريد؛ يرون مهماتهم فقط.'))+'</span></div></div>';
 h+=why('sh',esc(T('Wave 1 is a baseline: shoppers record what they see and only two rules are scored from day one (no promise outside the approved sheets, no contact outside official channels). Standards are set from the exercise with L&D.','الموجة 1 خط أساس: يسجّل المتسوقون ما يرونه، وتُقيَّم قاعدتان فقط من اليوم الأول (لا وعد خارج الأوراق المعتمدة، لا تواصل خارج القنوات الرسمية). تُوضع المعايير من التمرين مع L&D.')));return h}
function vCamp(){var h='<h1>'+esc(T('Campaigns','الحملات'))+'</h1><p class="lead">'+esc(T('Two kinds only in the pilot: AI interview campaigns on a segment of detractors, and mystery-shopper waves. Marketing campaigns live in Marketing\'s own platform.','نوعان فقط في البايلوت: حملات مقابلات الذكاء على شريحة من غير الراضين، وموجات المتسوق الخفي. حملات التسويق في منصة التسويق.'))+'</p>';
 [['ai',T('AI interview campaigns','حملات مقابلات الذكاء')],['shop',T('Mystery-shopper waves','موجات المتسوق الخفي')]].forEach(function(k){h+='<h2>'+esc(k[1])+'</h2>';CAMP.filter(function(c){return c.kind===k[0]}).forEach(function(c){var sc=c.script?SCRIPTS.filter(function(s){return s.id===c.script})[0]:null;h+='<div class="card"><div class="row"><div class="g"><h3>'+esc(L(c.n))+'</h3><div class="sm">'+esc(L(c.seg))+(sc?' · '+esc(T('script','السكربت')+': '+L(sc.n)):'')+(c.n_?' · '+c.n_+' '+esc(T('people','أشخاص')):'')+'</div></div><span class="tag '+(c.st==='running'?'ok':c.st==='closed'?'':'warn')+'">'+esc({running:T('running','تعمل'),closed:T('closed','مغلقة'),draft:T('draft','مسودة')}[c.st])+'</span></div></div>'})});
 h+='<div class="card"><div class="row"><button class="btn p" data-act="newcamp">'+esc(T('New AI interview campaign','حملة مقابلات ذكاء جديدة'))+'</button><span class="mut sm">'+esc(T('Segment · script · hand-off rules · capacity. Critical detractors are never in a campaign.','الشريحة · السكربت · قواعد الإحالة · السعة. غير الراضين الحرجون ليسوا في حملة أبداً.'))+'</span></div></div>';
 return h}
function vRules(){var h='<h1>'+esc(T('Rules and sources','القواعد والمصادر'))+'</h1><p class="lead">'+esc(T('The eight numbers the whole pilot runs on, and where the data comes from. Change a number here and every screen follows.','الأرقام الثمانية التي يعمل عليها البايلوت كله، ومن أين تأتي البيانات. غيّر رقماً هنا وتتبعه كل الشاشات.'))+'</p>';
 var rows=[['pattern',T('Signals of the same kind that make a pattern','إشارات من النوع نفسه تصنع نمطاً')],['window',T('Window, days','النافذة، أيام')],['callDays',T('Call a detractor within, working days','الاتصال بغير الراضي خلال، أيام عمل')],['approveDays',T('Manager approves a fix within, working days','يعتمد المدير الحل خلال، أيام عمل')],['callFrom',T('Calling hours from','ساعات الاتصال من')],['callTo',T('Calling hours to','ساعات الاتصال إلى')],['tries',T('Call attempts, then WhatsApp','محاولات الاتصال، ثم واتساب')],['check',T('Check a done fix after, days','فحص الحل المنجز بعد، أيام')]];
 h+='<div class="card"><table>'+rows.map(function(r){return '<tr><td>'+esc(r[1])+'</td><td style="width:120px"><input data-rule="'+r[0]+'" value="'+esc(val('rule|'+r[0],RULE[r[0]]))+'"></td></tr>'}).join('')+'</table><div class="row" style="margin-top:10px"><button class="btn p" data-save="rules">'+esc(T('Save','احفظ'))+'</button><span class="mut sm">'+esc(T('Legal to confirm the calling hours.','القانونية تؤكد ساعات الاتصال.'))+'</span></div></div>';
 h+='<h2>'+esc(T('Sources','المصادر'))+'</h2><div class="card"><table><tr><th>'+esc(T('Source','المصدر'))+'</th><th>'+esc(T('How','الطريقة'))+'</th><th>'+esc(T('Last received','آخر استلام'))+'</th><th></th></tr>'+SRC.map(function(x){return '<tr><td>'+esc(L(x.n))+'</td><td class="mut">'+esc(x.via)+'</td><td>'+esc(typeof x.last==='string'?x.last:L(x.last))+'</td><td><span class="tag '+(x.st==='ok'?'ok':'warn')+'">'+esc(x.st==='ok'?T('received','وصل'):T('late','متأخر'))+'</span></td></tr>'}).join('')+'</table><div class="mut sm" style="margin-top:8px">'+esc(T('A late feed is flagged on every Workspace screen as "data as of". Social accounts connect through Meta Business and are never surveyed.','التغذية المتأخرة تُعلَّم على كل شاشة في مكان العمل كـ "البيانات حتى". حسابات السوشال تُربط عبر Meta Business ولا تُستبان أبداً.'))+'</div></div>';return h}

 var nav=[['surveys',T('Surveys','الاستبيانات')],['scripts',T('AI scripts','سكربتات الذكاء')],['shopper',T('Mystery shopper','المتسوق الخفي')],['campaigns',T('Campaigns','الحملات')],['rules',T('Rules and sources','القواعد والمصادر')]].map(function(n){return '<button class="'+(S.sec===n[0]?'on':'')+'" data-sec="'+n[0]+'">'+esc(n[1])+'</button>'}).join('');
 document.getElementById('app').innerHTML='<div class="top"><b>PSI CX Setup</b>'+nav+'<span class="sp"></span><a href="PSI CX Pilot.html">← '+esc(T('Workspace','مكان العمل'))+'</a><button data-lang>'+(S.lang==='ar'?'English':'العربية')+'</button></div><main>'+V[S.sec]()+'<p class="mut sm" style="margin-top:30px">'+esc(T('CX manager only. Sample data; nothing is sent.','لمدير CX فقط. بيانات تجريبية؛ لا يُرسل شيء.'))+'</p></main>'+(S.toast?'<div class="toast">'+esc(S.toast)+'</div>':'')}
document.addEventListener('click',function(evt){var t=evt.target.closest('[data-sec],[data-sel],[data-save],[data-addq],[data-act],[data-why],[data-lang]');if(!t)return;
 if(t.dataset.lang!=null){S.lang=S.lang==='ar'?'en':'ar';render();return}
 if(t.dataset.sec){S.sec=t.dataset.sec;S.sel=null;render();return}
 if(t.dataset.sel){S.sel=S.sel===t.dataset.sel?null:t.dataset.sel;render();return}

 if(t.dataset.act==='newcamp'){CAMP.push({id:'AC-'+(CAMP.filter(function(c){return c.kind==='ai'}).length+1),kind:'ai',n:B('New campaign (draft)','حملة جديدة (مسودة)'),seg:B('Pick a segment','اختر شريحة'),script:'s1',n_:0,st:'draft'});toast(T('Draft campaign added.','أُضيفت حملة كمسودة.'))}
});
document.addEventListener('input',function(evt){var t=evt.target;if(t.dataset.ed)S.ed[t.dataset.ed]=t.value;if(t.dataset.rule)S.ed['rule|'+t.dataset.rule]=t.value});
