<!doctype html>
<html lang="en">
<head>

<title>PSI CX Pilot</title>
<style>
:root{--ink:#16212e;--mut:#5b6775;--line:#e3e7ec;--bg:#f5f7fa;--card:#fff;--navy:#12385b;--gold:#c8963e;--bad:#b42318;--ok:#1f7a4d;--warn:#b26a00;--soft:#eef2f7}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
[dir=rtl] body,[dir=rtl]{font-family:"Noto Naskh Arabic",Tahoma,Arial,sans-serif}
.top{background:var(--navy);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top b{font-size:17px}.top .sp{flex:1}
.top button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.top button.on{background:#fff;color:var(--navy);border-color:#fff}
.top select{border-radius:8px;padding:6px 8px;font:inherit;width:auto}
main{max-width:860px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:22px 0 8px}
.lead{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:center}.row>.g{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.bad{background:#fff;color:var(--bad);border-color:var(--bad)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mut)}
.tag.bad{background:#fde8e6;color:var(--bad)}.tag.ok{background:#e3f3ea;color:var(--ok)}.tag.warn{background:#fff1dc;color:var(--warn)}
.mut{color:var(--mut)}.sm{font-size:13px}
a.id{color:var(--navy);text-decoration:underline;cursor:pointer;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.why{font-size:13px;color:var(--navy);cursor:pointer;border:0;background:none;padding:0;text-decoration:underline}
.whybox{background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:14px}
.ev{display:grid;grid-template-columns:92px 86px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ev.flag{background:#fff8ee;margin:0 -16px;padding:8px 16px}
.ev .d{color:var(--mut);font-size:13px}.ev .c{font-size:13px}
.big{font-size:34px;font-weight:700;line-height:1.1}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num{cursor:pointer}.num:hover{border-color:var(--navy)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}.steps span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--soft)}.steps span.on{background:var(--gold);color:#fff}
@media(max-width:600px){.nums{grid-template-columns:1fr}.ev{grid-template-columns:80px 1fr}.ev .c{grid-column:2}}
</style>
</head>

 var negs=PUB.filter(function(x){return x.src!=='shop'&&envOK({env:x.env})&&(S.fp==='all'||x.p===S.fp)}),nn=negs.filter(function(x){return x.neg}),rep48=negs.filter(function(x){return x.replied&&x.hrs<=48}).length;

 h+='<div class="card">'+negs.map(function(x){return '<div class="sm">'+esc(x.d.slice(5).replace('-','/'))+' · <span class="tag">'+esc(L(CH[x.src]))+'</span> '+esc(L(x.t))+' '+(x.neg?'<span class="tag bad">'+esc(T('negative','سلبي'))+'</span> '+(x.kind?'<a class="id" data-go="signal" data-id="P-'+x.kind+'-'+x.p+'">'+esc(T('counted as a signal','عُدّت إشارة'))+'</a>':''):'<span class="tag ok">'+esc(T('positive','إيجابي'))+'</span>')+(x.replied?' · '+esc(T('replied in','رُدّ خلال')+' '+x.hrs+' h'):' · <span style="color:var(--bad)">'+esc(T('no reply yet','بلا رد بعد'))+'</span>')+'</div>'}).join('')+'</div>';
 var vs=VISITS.filter(function(v){return envOK(v)});if(S.fp==='all'||S.fp==='re'){h+='<h2>'+esc(T('Mystery shopper (MPS)','المتسوق الخفي (MPS)'))+'</h2><div class="nums"><div class="card"><div class="mut sm">'+esc(T('Visits this month','زيارات هذا الشهر'))+'</div><div class="big">'+vs.length+'</div></div><div class="card"><div class="mut sm">'+esc(T('Average score','متوسط الدرجة'))+'</div><div class="big">'+(vs.length?Math.round(vs.reduce(function(a,v){return a+v.score},0)/vs.length)+'%':'–')+'</div><div class="mut sm">'+esc(T('items met of the approved standards','بنود مستوفاة من المعايير المعتمدة'))+'</div></div><div class="card"><div class="mut sm">'+esc(T('Critical findings','ملاحظات حرجة'))+'</div><div class="big">'+PUB.filter(function(x){return x.sev==='critical'}).length+'</div><div class="mut sm">'+esc(T('each opened a case the same day','كل واحدة فتحت حالة في اليوم نفسه'))+'</div></div></div>';
  h+='<div class="card">'+vs.map(function(v){return '<div class="sm">'+esc(v.d.slice(5).replace('-','/'))+' · '+esc(L(v.place))+' · <b>'+v.score+'%</b> ('+v.met+' '+esc(T('of','من'))+' '+v.items+') · '+PUB.filter(function(x){return x.visit===v.id}).map(function(x){return '<span class="tag '+(x.sev==='critical'?'bad':x.sev==='medium'?'warn':'')+'">'+esc(x.sev)+'</span> '+esc(L(x.t).replace(/^[^:]+: /,''))}).join(' · ')+'</div>'}).join('')+'</div>'}
 h+='<div class="mut sm" style="margin-top:10px">'+esc(T('AI caller this month (context, not a score): '+AICALLS.n+' outbound calls, answered '+AICALLS.answered+'%, '+AICALLS.handed+' handed to an agent, '+AICALLS.visits+' viewing requests. Call quality is measured in the call-center platform, not here.','متصل الذكاء هذا الشهر (سياق، لا درجة): '+AICALLS.n+' مكالمة صادرة، رد '+AICALLS.answered+'%، '+AICALLS.handed+' أُحيلت لموظف، '+AICALLS.visits+' طلب معاينة. جودة المكالمات تُقاس في منصة الكول سنتر لا هنا.'))+'</div>';

function render(){var V={today:vToday,customers:vCustomers,customer:vCustomer,signals:vSignals,signal:vSignal,numbers:vNumbers,fixes:vFixes,case:vCase};document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
 var nav=[['today',T('Inbox','الإنبوكس')],['customers',T('Customers','الزبائن')],['signals',T('Signals','الإشارات')],['fixes',T('Fixes','الحلول')],['numbers',T('Voice of the Customer','صوت الزبون')]].map(function(n){var on=S.view===n[0]||(S.view==='customer'&&n[0]==='customers')||(S.view==='signal'&&n[0]==='signals')||(S.view==='case'&&n[0]==='today');return '<button class="'+(on?'on':'')+'" data-go="'+n[0]+'">'+esc(n[1])+'</button>'}).join('');

document.addEventListener('click',function(evt){var t=evt.target.closest('[data-go],[data-why],[data-act],[data-num],[data-lang],[data-filt],[data-setup]');if(!t)return;
 if(t.dataset.setup!=null){toast(T('Setup is the next build: surveys, scripts, shopper checklists, rules, sources. Manager only.','الإعداد هو البناء التالي: الاستبيانات، السكربتات، قوائم المتسوق، القواعد، المصادر. للمدير فقط.'));return}
 if(t.dataset.lang!=null){S.lang=S.lang==='ar'?'en':'ar';render();return}
 if(t.dataset.go){go(t.dataset.go,t.dataset.id);return}
 if(t.dataset.why){S.why[t.dataset.why]=!S.why[t.dataset.why];render();return}
 if(t.dataset.filt){S[t.dataset.filt]=t.dataset.v;S.nsel=null;render();return}
 if(t.dataset.num){S.nsel=S.nsel===t.dataset.num?null:t.dataset.num;render();return}
 var a=t.dataset.act;
 if(a==='call'){S.form={mode:'manual',code:'slow',out:'resolved'};render()}
 if(a==='aiopen'){S.form={mode:'ai',script:'s1'};render()}

 if(a==='aicancel'){delete S.ai[S.sel];render()}
 if(a==='ccsend'){S.cc[S.sel]={queued:TODAY};toast(T('Sent to the call center. A human agent calls within 2 working days.','أُرسلت للكول سنتر. يتصل موظف بشري خلال يومي عمل.'))}
 if(a==='cccancel'){delete S.cc[S.sel];render()}
 if(a==='caseAssign'){S.cases[t.dataset.id]='assigned';toast(T('Sent to the Sales manager, Abu Dhabi. Respond clock: 1 working day; resolve: 5.','أُرسلت لمدير المبيعات، أبوظبي. مهلة الرد: يوم عمل؛ الحل: 5.'))}
 if(a==='caseClose'){S.cases[t.dataset.id]='closed';toast(T('Case closed. The finding stays counted as a signal.','أُغلقت الحالة. تبقى الملاحظة معدودة كإشارة.'))}
 if(a==='aidemo'){var cc=cust(S.sel),r=aiResult(cc);S.ai[cc.id]=Object.assign(S.ai[cc.id],r);ev(cc.id,TODAY,'ai',T('AI call: ','مكالمة ذكاء: ')+L(r.ans[0].a)+' · '+T('reason','السبب')+': '+L(KIND[r.code])+(r.handoff?' · '+T('handed to a person','أُحيلت لشخص'):''),'');if(!r.handoff)S.called[cc.id]={re:new Date(Date.parse(TODAY)+7*864e5).toISOString().slice(0,10)};render()}

 if(a==='approve'){S.decided[t.dataset.id]='approved';toast(T('Approved. The owner is notified; due in 5 working days.','اعتُمد. أُبلغ المالك؛ الموعد خلال 5 أيام عمل.'))}
 if(a==='reject'){var r=prompt(T('Why? (one line)','لماذا؟ (سطر واحد)'));if(r==null)return;S.decided[t.dataset.id]='rejected';S.decided[t.dataset.id+'r']=r;toast(T('Rejected with a reason. The pattern stays open.','رُفض مع السبب. يبقى النمط مفتوحاً.'))}
});

document.addEventListener('change',function(ev){var t=ev.target;if(t.dataset.role!=null){S.role=t.value;go('today')}if(t.dataset.assign){S.assign[t.dataset.assign]=t.value;toast(T('Assigned to '+t.value+'.','أُسندت إلى '+t.value+'.'))}if(t.dataset.f&&S.form)S.form[t.dataset.f]=t.value});
