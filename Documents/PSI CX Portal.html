    var ev=[];
    if(it.ev!=='none'){
      var n=it.ev==='required'?1:(r()<0.5?1:0);
      for(var k=0;k<n;k++){

  if(quirk==='dup'){var keys=Object.keys(items),done=0,h0=null;keys.forEach(function(k){items[k].ev.forEach(function(e){if(done===0){h0=e.hash;done=1}else if(done===1&&e.kind!=='audio'){e.hash=h0;done=2}})})}

function revChecks(sub){
  var ck=ckById(sub.ck),req=0,have=0,out=[],late=0,seen={},dup=0,ev=0;
  ck.items.forEach(function(it){var e=(sub.items[it.id]||{ev:[]}).ev;if(it.ev==='required'){req++;if(e.length)have++}
    e.forEach(function(x){ev++;if(sub.win&&sub.win[0]&&x.ts&&(x.ts.slice(0,10)<sub.win[0]||x.ts.slice(0,10)>sub.win[1]))late++;if(x.hash){if(seen[x.hash])dup++;seen[x.hash]=1}})});
  out.push({k:have===req?'ok':'crit',t:T('Required evidence attached: ','الأدلة الإلزامية المرفقة: ')+have+' / '+req});
  if(sub.win&&sub.win[0])out.push({k:late?'crit':'ok',t:late?late+' '+T('evidence item(s) timestamped outside the visit window','دليل بتوقيت خارج نافذة الزيارة'):T('All timestamps fall inside the visit window ','كل التوقيتات ضمن نافذة الزيارة ')+sub.win[0]+' → '+sub.win[1]});
  else out.push({k:'ok',t:T('Timestamps read from the files\' own metadata','التوقيتات مقروءة من بيانات الملفات نفسها')});
  out.push({k:dup?'warn':'ok',t:dup?T('Same file used for more than one item','نفس الملف مستخدم لأكثر من بند'):T('No duplicate files ('+ev+' checked)','لا توجد ملفات مكررة (تم فحص '+ev+')')});
  out.push({k:'ok',t:T('Private link used once, shopper accredited','الرابط استُخدم مرة واحدة والمتسوّق معتمد')});
  return out}

function ruleMatch(q,r,a){if(q.type==='nps'||q.type==='rating'){var x=+a,v=+r.v;return r.op==='lte'?x<=v:r.op==='gte'?x>=v:x===v}return String(a)===String(r.v)}

function wh(a,b){if(b<=a)return 0;var tot=0,d=new Date(a);d.setHours(0,0,0,0);
  for(var n=0;n<400&&d.getTime()<b;n++){if(isWork(d)){var s=new Date(d);s.setHours(WH.s,0,0,0);var e=new Date(d);e.setHours(WH.e,0,0,0);var ov=Math.min(e.getTime(),b)-Math.max(s.getTime(),a);if(ov>0)tot+=ov}d.setDate(d.getDate()+1);d.setHours(0,0,0,0)}
  return tot/36e5}

  for(var n=0;n<400;n++){if(isWork(d)){var s=new Date(d);s.setHours(WH.s,0,0,0);var e=new Date(d);e.setHours(WH.e,0,0,0);var st=Math.max(cur,s.getTime());if(st<e.getTime()){var av=(e.getTime()-st)/36e5;if(rem<=av)return st+rem*36e5;rem-=av}}d.setDate(d.getDate()+1);d.setHours(0,0,0,0);cur=d.getTime()}
  return a}

function parseShoppers(raw,ty,ag){
  var lines=String(raw||'').split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean),added=0,dup=0,bad=[];
  if(lines.length&&/name|email|mobile/i.test(lines[0])&&lines[0].indexOf('@')<0&&!/\d{6}/.test(lines[0]))lines.shift();
  var ems={},mos={};SHOPPERS.forEach(function(s){ems[s.em]=1;mos[s.mo]=1});
  lines.forEach(function(line){
    var parts=line.split(/[,;\t]+/).map(function(x){return x.trim()}).filter(Boolean),em=null,mo=null,nm=null,err=null;
    parts.forEach(function(p){
      if(p.indexOf('@')>=0){if(EMAIL_RE.test(p))em=p.toLowerCase();else err=T('Invalid email address','بريد إلكتروني غير صحيح')}
      else if(/^[+\d\s()\-.]{6,}$/.test(p)){var m=normMobile(p);if(m)mo=m;else err=T('Invalid mobile number','رقم جوال غير صحيح')}
      else if(!nm)nm=p});
    if(err){bad.push([line,err]);return}
    if(!em&&!mo){bad.push([line,T('No email or mobile number found','لا يوجد بريد أو رقم جوال')]);return}
    if((em&&ems[em])||(mo&&mos[mo])){dup++;return}
    if(em)ems[em]=1;if(mo)mos[mo]=1;
