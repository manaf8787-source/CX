}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --brand:#7FB0E0; --brand-ink:#08203A; --gold:#E0B15C;
  --p-re:#3FC4BD; --p-af:#7399F6; --p-cl:#F2AB4C; --p-to:#B488EF; --p-ev:#F2809F;
  --good:#45CB8C; --warn:#F0B53D; --crit:#F4786F; --neutral:#4B5B6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A121A; --surface:#111C27; --surface2:#172433; --line:#243649; --ink:#E7EEF4; --muted:#8DA0B2;
  --brand:#7FB0E0; --brand-ink:#08203A; --gold:#E0B15C;
  --p-re:#3FC4BD; --p-af:#7399F6; --p-cl:#F2AB4C; --p-to:#B488EF; --p-ev:#F2809F;
  --good:#45CB8C; --warn:#F0B53D; --crit:#F4786F; --neutral:#4B5B6B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45;margin:0;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:19px;margin:0;font-weight:700;line-height:1.2}
h2{font-size:14px;margin:0;font-weight:600}
h3{font-size:12.5px;margin:0;font-weight:600}
p{margin:0}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);gap:14px;max-width:1400px;margin:0 auto}
.rail{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column;gap:12px;background:linear-gradient(170deg,var(--side) 0%,var(--side2) 100%);color:var(--side-ink);border-radius:12px;padding:14px 10px}

.logo{display:block;flex:none;width:32px;height:32px}
.brand b{display:block;font-size:14px;line-height:1.15}
.brand span{font-size:11px;color:var(--side-muted)}
.nav-b[aria-current="page"]{box-shadow:inset 3px 0 0 var(--gold)}
[dir=rtl] .nav-b[aria-current="page"]{box-shadow:inset -3px 0 0 var(--gold)}
.btn:focus-visible,.nav-b:focus-visible{outline-color:var(--gold)}
.ngroup{display:flex;flex-direction:column;gap:1px}
.ngroup h4{margin:6px 8px 4px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--side-muted);font-weight:600}
.nav-b{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;color:var(--side-ink);font-size:13px}
.nav-b:hover{background:rgba(255,255,255,.07)}
.nav-b[aria-current="page"]{background:rgba(255,255,255,.14);font-weight:600;box-shadow:inset 3px 0 0 var(--dot,#fff)}
[dir=rtl] .nav-b[aria-current="page"]{box-shadow:inset -3px 0 0 var(--dot,#fff)}
.nav-b:focus-visible,.btn:focus-visible,.pill-b:focus-visible,.seg button:focus-visible,.tabs button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dot,var(--side-muted));flex:none}
.rail-foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding:8px 6px 0;border-top:1px solid rgba(255,255,255,.12)}
.rail-foot .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:var(--side-ink)}
.main{min-width:0;display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.crumb{font-size:11.5px;color:var(--muted)}
.sample{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn);border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:600}
.pagehead{display:flex;flex-direction:column;gap:3px}
.lede{color:var(--muted);max-width:78ch}

.card.tint{background:var(--surface2)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.grid{display:grid;gap:12px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g-12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}

.up{color:var(--good)}.down{color:var(--crit)}

.chip.good{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}

.chip.crit{background:color-mix(in srgb,var(--crit) 16%,var(--surface));color:var(--crit)}

.ptag{--c:var(--brand);display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c);white-space:nowrap}
.ptag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 11px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.s{padding:2px 8px;font-size:12px}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill-b{--c:var(--brand);cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 11px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.pill-b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.pill-b[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:var(--c);font-weight:600}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:7px 12px;border-bottom:2px solid transparent;color:var(--muted);box-sizing:border-box;font-weight:500}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}

tbody tr:hover td{background:color-mix(in srgb,var(--brand) 5%,var(--surface))}
td.n,th.n{text-align:end;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.sel td{background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.stack{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--surface2)}
.stack i{display:block;height:100%}
.track{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden;min-width:60px}
.track i{display:block;height:100%;border-radius:5px;background:var(--c,var(--brand))}
.brow{display:grid;grid-template-columns:minmax(90px,1.2fr) minmax(70px,2fr) 42px;gap:8px;align-items:center;padding:3px 0}

.between{justify-content:space-between}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}

.seg button[aria-pressed="true"].p{background:color-mix(in srgb,var(--good) 20%,var(--surface));color:var(--good);font-weight:600}
.seg button[aria-pressed="true"].f{background:color-mix(in srgb,var(--crit) 18%,var(--surface));color:var(--crit);font-weight:600}
.seg button[aria-pressed="true"].n{background:var(--surface2);font-weight:600}
.seg button[aria-pressed="true"].v{background:color-mix(in srgb,var(--brand) 20%,var(--surface));color:var(--brand);font-weight:600}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=email],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}

.form{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--surface);min-width:0}

.modal{background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal.wide{max-width:860px}
/* children of flex columns keep their full height; the container scrolls instead of squeezing and clipping text */
.modal>*,.rail>*,.main>*,.list>*,.pv>*,.pagehead>*{flex-shrink:0}
.card{overflow-y:visible}
.opt{display:flex;gap:9px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}

.toast{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:70;max-width:90vw}
.pv{background:var(--surface2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pv .ans{display:flex;gap:5px;flex-wrap:wrap}
.pv .ans button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 10px;min-width:36px}
.pv .ans button:hover{border-color:var(--brand);color:var(--brand)}
.path{font-size:12px;display:flex;flex-direction:column;gap:3px}
.path div{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.empty{border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--muted)}
.ev{display:flex;gap:6px;flex-wrap:wrap}
.ev .th{width:92px;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface2);cursor:pointer;padding:0;text-align:start}
.ev .th img{display:block;width:100%;height:58px;object-fit:cover}
.ev .th span{display:block;padding:2px 5px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sheet{max-width:760px}
.prog{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--brand)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.card{overflow-x:auto}
.grid.g-case{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}@media(max-width:1000px){.grid.g-case{grid-template-columns:1fr}}

/* ---------- shared helpers ---------- */
function nps(p,d,n){return n?Math.round((p-d)/n*100):null}
function fmtN(v){return v==null?'–':(v>0?'+':'')+v}
function chip(k,t){return '<span class="chip '+k+'">'+esc(t)+'</span>'}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function npsCol(v){if(v<=20){return 'color-mix(in srgb,var(--warn) '+Math.round(clamp((v+20)/40,0,1)*100)+'%,var(--crit))'}return 'color-mix(in srgb,var(--good) '+Math.round(clamp((v-20)/50,0,1)*100)+'%,var(--warn))'}
function tile(label,val,sub,c){return '<div class="tile" style="--c:'+(c||'var(--brand)')+'"><div class="l">'+esc(label)+'</div><div class="v">'+val+'</div><div class="s">'+sub+'</div></div>'}
function head(title,lede,extra,crumb){return '<div class="pagehead"><div class="row between"><h1>'+esc(title)+'</h1>'+(extra||'')+'</div>'+(lede?'<p class="lede">'+esc(lede)+'</p>':'')+'</div>'}
function table(heads,rows,cls){
  return '<div class="tw"><table'+(cls?' class="'+cls+'"':'')+'><thead><tr>'+heads.map(function(h){return '<th'+(h.n?' class="n"':'')+'>'+esc(h.t)+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){var rc='';if(r.cells){rc=r.cls?' class="'+r.cls+'"':'';r=r.cells}return '<tr'+rc+'>'+r.map(function(c,i){return '<td'+(heads[i]&&heads[i].n?' class="n"':'')+'>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
function meter(v,max,hi,mid){var pc=clamp(v/max*100,0,100),col=v>=hi?'var(--good)':v>=mid?'var(--warn)':'var(--crit)';return '<div class="row" style="gap:6px;flex-wrap:nowrap"><span class="mono" style="min-width:34px;text-align:end">'+(max===5?v.toFixed(1):v)+'</span><div class="track" style="flex:1;--c:'+col+'"><i style="width:'+pc+'%"></i></div></div>'}
function barRows(rows,color,max){var m=max||Math.max.apply(null,rows.map(function(r){return r[1]}));return rows.map(function(r){return '<div class="brow"><span>'+esc(r[0])+'</span><div class="track" style="--c:'+color+'"><i style="width:'+(r[1]/m*100)+'%"></i></div><span class="mono" style="text-align:end">'+(r[2]!=null?r[2]:r[1])+'</span></div>'}).join('')}
function prodPills(){return '<div class="pills">'+[{id:'all',n:B('All products','كل المنتجات'),v:'--brand'}].concat(P).map(function(p){return '<button class="pill-b" style="--c:var('+p.v+')" data-act="prod" data-id="'+p.id+'" aria-pressed="'+(S.prod===p.id)+'">'+esc(L(p.n))+'</button>'}).join('')+'</div>'}
function stackBar(a){return a.n?'<div class="stack" title="'+esc(T('Promoters / Passives / Detractors','المروّجون / المحايدون / المنتقدون'))+'"><i style="width:'+(a.P/a.n*100)+'%;background:var(--good)"></i><i style="width:'+(a.A/a.n*100)+'%;background:var(--neutral)"></i><i style="width:'+(a.D/a.n*100)+'%;background:var(--crit)"></i></div>':'<div class="hint">'+esc(T('No data yet','لا توجد بيانات بعد'))+'</div>'}
function agg(rows){return rows.reduce(function(a,r){a.n+=r.n;a.P+=r.P;a.A+=r.A;a.D+=r.D;a.cs+=r.cs*r.n;return a},{n:0,P:0,A:0,D:0,cs:0})}
function spark(vals,color,w,h){var v=vals.filter(function(x){return x>0});if(v.length<2)return '';var mn=Math.min.apply(null,v)-4,mx=Math.max.apply(null,v)+4,W=w||120,H=h||34,n=vals.length;
  var pts=vals.map(function(x,i){return x>0?[i*(W-6)/(n-1)+3,H-3-(x-mn)/(mx-mn)*(H-6)]:null}).filter(Boolean);
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true"><path d="'+pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ')+'" fill="none" style="stroke:'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+pts[pts.length-1][0].toFixed(1)+'" cy="'+pts[pts.length-1][1].toFixed(1)+'" r="3" style="fill:'+color+'"/></svg>'}
function lineChart(){
  var W=640,H=230,pl=34,pr=40,pt=12,pb=28,max=80,n=MONTHS.length;
  var x=function(i){return pl+i*(W-pl-pr)/(n-1)},y=function(v){return pt+(max-v)*(H-pt-pb)/max};
  var g='',i;
  for(i=0;i<=4;i++){var v=i*20;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" style="stroke:var(--line)"/><text x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end" style="fill:var(--muted);font-size:11px;font-family:var(--mono)">'+v+'</text>'}
  for(i=0;i<n;i++){g+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" style="fill:var(--muted);font-size:11px">'+esc(L(MONTHS[i]))+'</text>'}
  var ends=[];
  P.forEach(function(p){
    if(S.prod!=='all'&&S.prod!==p.id)return;
    var d=TREND[p.id].map(function(v,k){return (k?'L':'M')+x(k)+' '+y(v)}).join(' ');
    g+='<path d="'+d+'" fill="none" style="stroke:var('+p.v+')" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    TREND[p.id].forEach(function(v,k){if(k<n-1)g+='<circle cx="'+x(k)+'" cy="'+y(v)+'" r="2.2" style="fill:var('+p.v+')"/>'});
    ends.push({y:y(TREND[p.id][n-1]),v:TREND[p.id][n-1],c:p.v})});
  ends.sort(function(a,b){return a.y-b.y});
  for(i=1;i<ends.length;i++){if(ends[i].y-ends[i-1].y<13)ends[i].y=ends[i-1].y+13}
  ends.forEach(function(e){g+='<circle cx="'+x(n-1)+'" cy="'+e.y+'" r="4" style="fill:var('+e.c+')"/><text x="'+(x(n-1)+9)+'" y="'+(e.y+4)+'" style="fill:var(--ink);font-size:12px;font-family:var(--mono)">'+e.v+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(T('NPS by month','NPS شهرياً'))+'">'+g+'</svg>'}

function revChecks(sub){
  var ck=ckById(sub.ck),req=0,have=0,out=[],late=0,seen={},dup=0,ev=0;
  ck.items.forEach(function(it){var e=(sub.items[it.id]||{ev:[]}).ev;if(it.ev==='required'){req++;if(e.length)have++}
    e.forEach(function(x){ev++;if(sub.win&&sub.win[0]&&x.ts&&(x.ts.slice(0,10)<sub.win[0]||x.ts.slice(0,10)>sub.win[1]))late++;if(x.hash){if(seen[x.hash])dup++;seen[x.hash]=1}})});
  out.push({k:have===req?'ok':'crit',t:T('Required evidence attached: ','الأدلة الإلزامية المرفقة: ')+have+' / '+req});
  if(sub.win&&sub.win[0])out.push({k:late?'crit':'ok',t:late?late+' '+T('evidence item(s) timestamped outside the visit window','دليل بتوقيت خارج نافذة الزيارة'):T('All timestamps fall inside the visit window ','كل التوقيتات ضمن نافذة الزيارة ')+sub.win[0]+' → '+sub.win[1]});
  else out.push({k:'ok',t:T('Timestamps read from the files\' own metadata','التوقيتات مقروءة من بيانات الملفات نفسها')});
  out.push({k:dup?'warn':'ok',t:dup?T('Same file used for more than one item','نفس الملف مستخدم لأكثر من بند'):T('No duplicate files ('+ev+' checked)','لا توجد ملفات مكررة (تم فحص '+ev+')')});
  out.push({k:'ok',t:T('Private link used once, shopper accredited','الرابط استُخدم مرة واحدة والمتسوّق معتمد')});
  return out}

function qIndex(s,id){for(var i=0;i<s.qs.length;i++){if(s.qs[i].id===id)return i}return -1}
function qNum(s,id){return 'Q'+(qIndex(s,id)+1)}
function ansLabel(q,a){if(q.type==='choice'){return q.opts[+a]?L(q.opts[+a]):''}if(q.type==='yesno'){return a==='yes'?T('Yes','نعم'):T('No','لا')}return a}
function ruleMatch(q,r,a){if(q.type==='nps'||q.type==='rating'){var x=+a,v=+r.v;return r.op==='lte'?x<=v:r.op==='gte'?x>=v:x===v}return String(a)===String(r.v)}
function ruleText(s,q,r){var opx=r.op==='lte'?'≤':r.op==='gte'?'≥':'=';var val=(q.type==='choice')?L(q.opts[+r.v]||B('?','?')):(q.type==='yesno'?(r.v==='yes'?T('Yes','نعم'):T('No','لا')):r.v);return T('if answer ','إذا كانت الإجابة ')+(q.type==='choice'||q.type==='yesno'?'':opx+' ')+val}
function nextOf(s,q,a){var rs=q.rules||[];for(var i=0;i<rs.length;i++){if(ruleMatch(q,rs[i],a))return {go:rs[i].go,why:ruleText(s,q,rs[i])}}if(q.next)return {go:q.next,why:null};var i2=qIndex(s,q.id)+1;return {go:i2<s.qs.length?s.qs[i2].id:'end',why:null}}

function dayKey(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}

function wh(a,b){if(b<=a)return 0;var tot=0,d=new Date(a);d.setHours(0,0,0,0);
  for(var n=0;n<400&&d.getTime()<b;n++){if(isWork(d)){var s=new Date(d);s.setHours(WH.s,0,0,0);var e=new Date(d);e.setHours(WH.e,0,0,0);var ov=Math.min(e.getTime(),b)-Math.max(s.getTime(),a);if(ov>0)tot+=ov}d.setDate(d.getDate()+1);d.setHours(0,0,0,0)}
  return tot/36e5}
function addWH(a,h){var rem=h,cur=a,d=new Date(a);d.setHours(0,0,0,0);
  for(var n=0;n<400;n++){if(isWork(d)){var s=new Date(d);s.setHours(WH.s,0,0,0);var e=new Date(d);e.setHours(WH.e,0,0,0);var st=Math.max(cur,s.getTime());if(st<e.getTime()){var av=(e.getTime()-st)/36e5;if(rem<=av)return st+rem*36e5;rem-=av}}d.setDate(d.getDate()+1);d.setHours(0,0,0,0);cur=d.getTime()}
  return a}

 {k:['CSAT','Customer satisfaction','رضا العملاء'],n:B('CSAT (Customer Satisfaction)','CSAT (رضا العملاء)'),d:B('One question about a specific experience: "How satisfied were you with …?" answered 1 to 5. CSAT = share of answers that were 4 or 5.','سؤال واحد عن تجربة محددة: "ما مدى رضاك عن …؟" من 1 إلى 5. CSAT = نسبة الإجابات 4 أو 5.'),x:B('Example: 100 answers, 78 gave 4 or 5 → CSAT 78%. NPS asks about the relationship; CSAT asks about one moment (a call, a handover, a visit).','مثال: 100 إجابة، 78 منها 4 أو 5 → CSAT يساوي 78%. NPS يسأل عن العلاقة؛ CSAT يسأل عن لحظة واحدة (مكالمة، تسليم، زيارة).')},
 {k:['Promoters','المروّجون'],n:B('Promoters','المروّجون'),d:B('People who answered 9 or 10 on the NPS question. They recommend PSI and refer others.','من أجابوا 9 أو 10 على سؤال NPS. يوصون بـ PSI ويحيلون غيرهم.')},

 {k:['Mystery shop score','Mystery shopper score','MPS','نتيجة المتسوّق السري','نتيجة المتسوق السري'],n:B('Mystery shopper score (MPS)','نتيجة المتسوق السري (MPS)'),d:B('A trained shopper visits or calls as a customer and fills a checklist. The score is the share of checklist items met, 0 to 100, across approved visits. Only approved standards are scored; items under a draft or observe-only standard are recorded, not scored.','متسوق مدرّب يزور أو يتصل كعميل ويعبّئ قائمة تحقق. النتيجة هي نسبة بنود القائمة المحققة من 0 إلى 100 عبر الزيارات المعتمدة. تُسجَّل فقط المعايير المعتمدة؛ أما بنود المعايير المسودة أو للملاحظة فتُدوَّن ولا تُحتسب.'),x:B('Example: 20 scored items, 14 met → 70.','مثال: 20 بنداً محتسباً، تحقق 14 → 70.')},
 {k:['App CSAT','App rating','رضا التطبيق','تقييم التطبيق'],n:B('App CSAT','رضا التطبيق'),d:B('The average of in-app ratings, 1 to 5 stars, over the period. A rating of 1 or 2 counts as a detractor.','متوسط تقييمات التطبيق من 1 إلى 5 نجوم خلال الفترة. التقييم 1 أو 2 يُعد منتقداً.')},
 {k:['Signals','Signal','الإشارات','إشارة'],n:B('Signal','إشارة'),d:B('Any complaint, low score, missed deadline or bad rating from any channel, counted on one list. A signal is counted, not worked one by one: the system that owns it (CRM, PSI Club, support) handles the customer.','أي شكوى أو نتيجة منخفضة أو خرق موعد أو تقييم سيئ من أي قناة، تُعدّ في قائمة واحدة. الإشارة تُعدّ ولا تُعالج فرادى: النظام الذي يملكها (CRM، نادي PSI، الدعم) يتولى العميل.')},
 {k:['Patterns','Pattern','Patterns ready','الأنماط','نمط','أنماط جاهزة'],n:B('Pattern','نمط'),d:B('Signals that repeat past a threshold: the same agent 3 times, the same issue 5 times, or more than half from one branch, within 30 days. One pattern gets one corrective action.','إشارات تتكرر فوق عتبة: نفس الموظف 3 مرات، أو نفس المشكلة 5 مرات، أو أكثر من النصف من فرع واحد، خلال 30 يوماً. لكل نمط إجراء تصحيحي واحد.')},
 {k:['Corrective action','Corrective actions','Open corrective actions','إجراء تصحيحي','الإجراءات التصحيحية','إجراءات تصحيحية مفتوحة'],n:B('Corrective action','إجراء تصحيحي'),d:B('A change that removes the cause of a repeated problem, with one owner, a due date and a 30-day check. Corrective fixes a cause that already hurt customers; preventive stops a cause before it does.','تغيير يزيل سبب مشكلة متكررة، له مسؤول واحد وموعد وفحص بعد 30 يوماً. التصحيحي يعالج سبباً أضر بالعملاء فعلاً؛ والوقائي يمنع سبباً قبل أن يضر.')},
 {k:['Effective','Effective / not effective','30-day check','فعّالة','فحص 30 يوماً'],n:B('30-day check and effectiveness','فحص 30 يوماً والفعالية'),d:B('Thirty days after an action is done, the portal counts the same signals again. Effective means they dropped; not effective means they did not, and the action goes back to its root cause.','بعد 30 يوماً من إنجاز الإجراء تعيد البوابة عدّ الإشارات نفسها. فعّال يعني انخفضت؛ وغير فعّال يعني لم تنخفض، فيعود الإجراء إلى سببه الجذري.')},
 {k:['Hand-off','Hand-offs','Hand-offs pending','تسليم','التسليمات'],n:B('Hand-off','تسليم'),d:B('A fix for one customer that another system owns, such as a do-not-call flag in the CRM or a recovery call. The portal records where it went and checks it was done; no clock runs here.','إصلاح لعميل واحد يملكه نظام آخر، مثل علامة عدم الاتصال في CRM أو مكالمة استرداد. تسجّل البوابة إلى أين ذهب وتتحقق أنه تم؛ ولا مؤقت هنا.')},
 {k:['Runaway','Runaway customers','هاربون','الهاربون','العملاء الهاربون'],n:B('Runaway customer','عميل هارب'),d:B('A person who left, went quiet, froze or did not renew. Six types: went to a competitor, silent lead, frozen deal or payment, did not renew, dormant owner, complained then left. The page shows what the record says we did wrong.','شخص غادر أو صمت أو تجمّد أو لم يجدد. ستة أنواع: ذهب إلى منافس، عميل محتمل صامت، صفقة أو دفعة مجمّدة، لم يجدد، مالك خامل، اشتكى ثم غادر. الصفحة تعرض ما يقوله السجل عن خطئنا.')},
 {k:['Persona','Personas','شخصية','الشخصيات'],n:B('Persona','شخصية'),d:B('A group of customers who behave alike: where they live, what they do, which channel they use, what goes wrong for them. Built from the CRM and the timeline, not from assumptions. Each persona carries a recommendation to Marketing.','مجموعة عملاء يتصرفون بطريقة متشابهة: أين يعيشون، ماذا يعملون، أي قناة يستخدمون، وما الذي يسوء معهم. تُبنى من CRM والخط الزمني لا من الافتراضات. كل شخصية تحمل توصية للتسويق.')},
 {k:['Customer journey','Journeys','Journey','رحلة العميل','الرحلات'],n:B('Customer journey','رحلة العميل'),d:B('Every contact between one person and PSI, from every channel, in date order, with what was promised and what happened. Leads included.','كل تواصل بين شخص واحد و PSI من كل القنوات بترتيب التاريخ، مع ما وُعد وما حدث. العملاء المحتملون مشمولون.')},
 {k:['Repeat contact','Repeat in 48 h','تكرار'],n:B('Repeat contact','تكرار الاتصال'),d:B('The same person comes back about the same matter. Within 48 hours means the first answer failed; within 7 days the fix was incomplete; within 30 days the problem came back.','نفس الشخص يعود عن نفس الأمر. خلال 48 ساعة معناه الإجابة الأولى فشلت؛ خلال 7 أيام الحل كان ناقصاً؛ خلال 30 يوماً المشكلة عادت.')},
 {k:['Channel switch','Forced switch','انتقال قسري'],n:B('Channel switch','الانتقال بين القنوات'),d:B('A customer moves from one channel to another. Healthy when PSI asked for it (send documents by email); forced when the first channel gave no reply, which is a failure we count.','انتقال العميل من قناة إلى أخرى. طبيعي عندما تطلبه PSI (أرسل المستندات بالبريد)؛ وقسري عندما لا ترد القناة الأولى، وهذا فشل نعدّه.')},
 {k:['Speed to lead','السرعة في الوصول للعميل'],n:B('Speed to lead','سرعة الوصول للعميل المحتمل'),d:B('How fast a new lead is reached after an ad click or app enquiry. The system rings the agent pool first and calls the customer only when an agent picks up.','سرعة الوصول إلى عميل محتمل جديد بعد نقر إعلان أو استفسار في التطبيق. يرن النظام على مجموعة الموظفين أولاً ولا يتصل بالعميل إلا عندما يرد موظف.')},
 {k:['Lead','Leads','عميل محتمل','العملاء المحتملون'],n:B('Lead','عميل محتمل'),d:B('A person who enquired but has not bought or rented yet. Part of the journey from the first click; a lead that goes quiet is a runaway nobody complains about.','شخص استفسر ولم يشترِ أو يستأجر بعد. جزء من الرحلة منذ أول نقرة؛ والعميل المحتمل الذي يصمت هارب لا يشتكي منه أحد.')},
 {k:['SLA','Service level','مدة الخدمة'],n:B('SLA (service level)','مدة الخدمة (SLA)'),d:B('The time promised for a step, counted in working hours: respond within X, resolve within Y. A breach escalates to the next level.','الوقت الموعود لخطوة، يُحتسب بساعات العمل: الرد خلال X والمعالجة خلال Y. الخرق يصعّد إلى المستوى التالي.')},
 {k:['Environment','البيئة'],n:B('Environment','البيئة'),d:B('A sales company or branch under PSI with its own staff: Dubai, Abu Dhabi, PSI Assets (rental). Fixed in the CRM.','شركة أو فرع مبيعات تحت PSI بموظفيه: دبي، أبوظبي، PSI للأصول (التأجير). ثابتة في CRM.')},
 {k:['Pool','المجموعة'],n:B('Pool','مجموعة الموظفين'),d:B('The agents under one team lead in one environment. Leads rotate across the pool.','الموظفون تحت قائد فريق واحد في بيئة واحدة. يتناوب العملاء المحتملون على المجموعة.')},
 {k:['Omnichannel','أومني تشانل','متعدد القنوات'],n:B('Omnichannel','تعدد القنوات المتكامل'),d:B('One record per person with every channel on it, so the customer never repeats himself and PSI sees the whole story. Multichannel is many channels; omnichannel is many channels that know each other.','سجل واحد لكل شخص وكل القنوات عليه، فلا يكرر العميل نفسه وترى PSI القصة كاملة. تعدد القنوات يعني قنوات كثيرة؛ والتكامل يعني قنوات تعرف بعضها.')}];

 {id:'a3',n:B('Signals and patterns','الإشارات والأنماط'),task:B('Decide when repeated events become a signal, find where it concentrates, set the impact; compute the public reputation index.','تقرير متى تصبح الأحداث المتكررة إشارة، وأين تتركز، وتحديد الأثر؛ وحساب مؤشر السمعة العامة.'),runs:B('After every classification; full recount nightly','بعد كل تصنيف؛ إعادة عدّ كاملة ليلاً'),in:B('classifications in the 30-day window, thresholds, impact rules, public pool','التصنيفات في نافذة 30 يوماً، العتبات، قواعد الأثر، المجمّع العام'),out:B('signal {reason code, product, environment, count, concentration, impact, evidence, detection}','إشارة {رمز، منتج، بيئة، عدد، تركّز، أثر، دليل، كشف}'),rules:B('30 days · same issue 5 · same agent 3 · concentration 50% · min sample 10 · legal, privacy, safety at count 1','30 يوماً · نفس المشكلة 5 · نفس الموظف 3 · تركّز 50% · عينة 10 · القانوني والخصوصية والسلامة من أول مرة'),model:B('Title and a three-sentence explanation from the evidence only','عنوان وشرح من ثلاث جمل من الدليل فقط'),sup:B('every count recomputed; evidence ids exist; explanation names nothing absent from the evidence','كل عدد يُعاد حسابه؛ معرّفات الدليل موجودة؛ الشرح لا يذكر ما ليس في الدليل'),esc:B('CX manager on critical; Internal Audit and Marketing Lead on a feed spike (3x)','مدير CX عند الحرج؛ مدير التدقيق والتسويق عند قفزة تغذية (3 أضعاف)'),shows:B('Actions page (Signals tab), home tiles, "how the AI found this"','صفحة الإجراءات (تبويب الإشارات)، بلاطات الرئيسية، "كيف وجد الذكاء الاصطناعي هذا"'),stage:'limited',appr:96},

 {id:'a8',n:B('Close the loop','إغلاق الحلقة'),task:B('Decide who the CX team calls this month within capacity, prepare each brief, code each interview; run AI campaigns the team creates.','تحديد من يتصل به فريق CX هذا الشهر ضمن الطاقة، وتحضير كل ملخص، وترميز كل مقابلة؛ وتشغيل حملات AI التي ينشئها الفريق.'),runs:B('On each detractor; capacity run on the 1st; on each submitted interview','عند كل معترض؛ تشغيل الطاقة في الأول؛ عند كل مقابلة مُدخلة'),in:B('detractor events, capacity settings, interview forms, reason codes, campaign scripts and rules','أحداث المعترضين، إعدادات الطاقة، نماذج المقابلات، رموز الأسباب، سكريبتات الحملات وقواعدها'),out:B('call item {priority, due, brief}; interview {outcome, answers, codes, summary, interviewer human or ai}','سطر اتصال {أولوية، موعد، ملخص}؛ مقابلة {نتيجة، إجابات، رموز، ملخص، المحاوِر بشري أو AI}'),rules:B('capacity = people × hours × 4 × working days; critical always 100% and always a person; cooldown 90 days; hand-off rules on every campaign','الطاقة = أشخاص × ساعات × 4 × أيام العمل؛ الحرج 100% ودائماً شخص؛ فترة راحة 90 يوماً؛ قواعد التحويل على كل حملة'),model:B('The brief before the call; the coded summary after it','الملخص قبل المكالمة؛ الملخص المرمّز بعدها'),sup:B('capacity arithmetic; critical coverage 100%; brief contains only facts from events','حساب الطاقة؛ تغطية الحرج 100%؛ الملخص من وقائع الأحداث فقط'),esc:B('CX manager when the list exceeds capacity by 20% two months running','مدير CX عند تجاوز القائمة الطاقة بـ20% شهرين متتاليين'),shows:B('Close the loop page, journey events, report KPI','صفحة إغلاق الحلقة، أحداث الرحلة، مؤشر التقرير'),stage:'shadow',appr:93},

 launch:function(d){S.modal={t:'launch',b:d.b};render()}, closeModal:function(){S.modal=null;S.shopperPv=null;render()},
 doLaunch:function(){var c=curCamp(),b=c.batches.filter(function(x){return x.id===S.modal.b})[0],r=document.querySelector('input[name=lch]:checked');b.ch=r?r.value:'ai';if(b.ch==='whatsapp'&&!waReady('sv:'+b.sv)){toast(T('The WhatsApp template is not approved yet.','قالب واتساب لم يُعتمد بعد.'));return}b.st='scheduled';S.modal=null;toast(T('Batch scheduled via ','تمت جدولة الدفعة عبر ')+L(CHN[b.ch])+T('. Nothing was sent.','. لم يتم إرسال شيء.'))},
 addQ:function(){var s=SURVEYS[S.surv];s.qs.push({id:newId(),type:'rating',t:B('New question','سؤال جديد'),rules:[]});render()},
 delQ:function(d){var s=SURVEYS[S.surv];if(s.qs.length<2){toast(T('A survey needs at least one question.','يحتاج الاستبيان إلى سؤال واحد على الأقل.'));return}s.qs=s.qs.filter(function(q){return q.id!==d.q});s.qs.forEach(function(q){q.rules=(q.rules||[]).filter(function(r){return r.go!==d.q});if(q.next===d.q)q.next=''});S.pv=null;render()},
 moveQ:function(d){var s=SURVEYS[S.surv],i=qIndex(s,d.q),j=i+(+d.d);if(j<0||j>=s.qs.length)return;var t=s.qs[i];s.qs[i]=s.qs[j];s.qs[j]=t;S.pv=null;render()},
 addOpt:function(d){Q(d.q).opts.push(B('Option','خيار'));render()},
 delOpt:function(d){var q=Q(d.q);if(q.opts.length<2)return;q.opts.splice(+d.i,1);q.rules=(q.rules||[]).filter(function(r){return +r.v<q.opts.length});render()},
 addRule:function(d){var q=Q(d.q);var v=q.type==='nps'?'6':q.type==='rating'?'2':q.type==='yesno'?'no':'0';q.rules=q.rules||[];q.rules.push({op:(q.type==='nps'||q.type==='rating')?'lte':'eq',v:v,go:'end'});S.pv=null;render()},
 delRule:function(d){Q(d.q).rules.splice(+d.i,1);S.pv=null;render()},
 pvStart:function(){var s=SURVEYS[S.surv];S.pv={sid:S.surv,cur:s.qs[0].id,path:[]};render()},
 pvAns:function(d){var s=SURVEYS[S.surv],pv=S.pv,q=s.qs[qIndex(s,pv.cur)],a=d.v;if(a==='__open'){a=($('pv-open').value||'').trim()||'(–)'}var nx=nextOf(s,q,a);pv.path.push({q:q.id,a:a,go:nx.go,why:nx.why});pv.cur=nx.go;render()}
};
var CHG={
 selSurv:function(el){S.surv=el.value;S.pv=null;render()},
 qtext:function(el,d){Q(d.q).t[d.l]=el.value;S.pv=null;render()},
 qopt:function(el,d){Q(d.q).opts[+d.i][d.l]=el.value;render()},
 qtype:function(el,d){var q=Q(d.q);q.type=el.value;q.rules=[];if(q.type==='choice'&&!q.opts)q.opts=[B('Option 1','خيار 1'),B('Option 2','خيار 2')];S.pv=null;render()},
 qnext:function(el,d){var q=Q(d.q);if(el.value)q.next=el.value;else delete q.next;S.pv=null;render()},
 rop:function(el,d){Q(d.q).rules[+d.i].op=el.value;S.pv=null;render()},
 rval:function(el,d){Q(d.q).rules[+d.i].v=String(el.value);S.pv=null;render()},
 rgo:function(el,d){Q(d.q).rules[+d.i].go=el.value;S.pv=null;render()},
 /* checklist editor */
 ckname:function(el,d){ckById(S.ck).name[d.l]=el.value;render()},
 ckch:function(el){ckById(S.ck).ch=el.value;render()},
 ckprod:function(el){ckById(S.ck).prod=el.value;render()},
 ittext:function(el,d){itemOf(ckById(S.ck),d.i).t[d.l]=el.value;render()},
 itsec:function(el,d){itemOf(ckById(S.ck),d.i).sec=el.value;render()},
 ittype:function(el,d){var it=itemOf(ckById(S.ck),d.i);it.type=el.value;if(it.type==='text'){it.w=0;it.crit=false}else if(!it.w&&!it.crit)it.w=2;render()},
 itw:function(el,d){itemOf(ckById(S.ck),d.i).w=clamp(+el.value||0,0,5);render()},
 itcrit:function(el,d){var it=itemOf(ckById(S.ck),d.i);it.crit=el.checked;if(it.crit)it.w=0;else if(!it.w)it.w=2;render()},
 itev:function(el,d){var it=itemOf(ckById(S.ck),d.i);it.ev=el.value;if(it.ev!=='none'&&!it.evt.length)it.evt=['photo'];render()},
 itevt:function(el,d){var it=itemOf(ckById(S.ck),d.i),k=d.k,ix=it.evt.indexOf(k);if(el.checked&&ix<0)it.evt.push(k);if(!el.checked&&ix>=0)it.evt.splice(ix,1);if(!it.evt.length)it.evt=['photo'];render()},
 /* shoppers / distribution / review */
 shCsv:function(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){S.shBulk=String(r.result||'');render()};r.readAsText(f)},
 asgCk:function(el){S.asgCk=el.value;S.asgSc='';render()},
 asgSc:function(el){S.asgSc=el.value;render()},
 asgSh:function(el,d){S.asgSel[d.id]=el.checked;render()},
 asgCh:function(el,d){S.asgCh[d.id]=el.checked;render()},
 asgF2:function(el,d){S.asgForm=S.asgForm||{due:'2026-11-01',w1:'2026-10-26',w2:'2026-11-01',exp:'7',rem:'24'};S.asgForm[d.k]=el.value;render()},
 asgMsg:function(el){S.asgMsg=el.value},
 rvCmt:function(el,d){var m=S.revCmt[S.rev]=S.revCmt[S.rev]||{};m[d.i]=el.value},
 pvText:function(el,d){S.pvAns[d.i]=el.value;render()},
 pvFile:function(el,d){
   var ck=ckById(S.shopperPv.ck),it=itemOf(ck,d.i),list=S.pvFiles[d.i]=S.pvFiles[d.i]||[],msg=null;
   Array.prototype.forEach.call(el.files,function(f){
     if(list.length>=5){msg=T('Up to 5 files per item.','حتى 5 ملفات لكل بند.');return}
     if(f.size>15e6){msg=T('Files must be under 15 MB.','يجب أن يقل حجم الملف عن 15 ميغابايت.');return}
     var kind=null;
     if(f.type.indexOf('audio/')===0)kind='audio';else if(f.type.indexOf('image/')===0)kind=it.evt.indexOf('photo')>=0?'photo':'screenshot';
     if(!kind||(kind==='audio'&&it.evt.indexOf('audio')<0)||(kind!=='audio'&&it.evt.indexOf('photo')<0&&it.evt.indexOf('screenshot')<0)){msg=T('This item does not accept that file type.','هذا البند لا يقبل نوع الملف هذا.');return}
     list.push({kind:kind,name:f.name,size:f.size,url:URL.createObjectURL(f),ts:fmtTs(f.lastModified||Date.now()),hash:'h'+(f.size%9000+1000)})});
   if(msg){toast(msg)}else render()}
};
[ORGACT,INSACT,MOREACT,V3ACT,V4ACT,V6ACT,V7ACT,V8ACT,V9ACT,V10ACT,V11ACT,V12ACT,V14ACT,V15ACT,V16ACT,V17ACT,V18ACT,V21ACT,V22ACT,V23ACT,V24ACT,V25ACT,V26ACT,V27ACT,V28ACT].forEach(function(m){Object.keys(m).forEach(function(k){ACT[k]=m[k]})});[ORGCHG,INSCHG,MORECHG,V3CHG,V4CHG,V6CHG,V8CHG,V9CHG,V15CHG,V17CHG,V24CHG,V25CHG,V26CHG].forEach(function(m){Object.keys(m).forEach(function(k){CHG[k]=m[k]})});Object.keys(WAACT).forEach(function(k){ACT[k]=WAACT[k]});Object.keys(WACHG).forEach(function(k){CHG[k]=WACHG[k]});Object.keys(SHACT).forEach(function(k){ACT[k]=SHACT[k]});Object.keys(SHCHG).forEach(function(k){CHG[k]=SHCHG[k]});Object.keys(INCACT).forEach(function(k){ACT[k]=INCACT[k]});Object.keys(INCCHG).forEach(function(k){CHG[k]=INCCHG[k]});Object.keys(CCACT).forEach(function(k){ACT[k]=CCACT[k]});Object.keys(DESKACT).forEach(function(k){ACT[k]=DESKACT[k]});Object.keys(DESKCHG).forEach(function(k){CHG[k]=DESKCHG[k]});
document.addEventListener('click',function(e){
  if(e.target.closest('[data-stop]')&&!e.target.closest('[data-act]'))return;
  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.classList.contains('modal-bg')&&e.target!==el)return;
  var f=ACT[el.dataset.act];if(f)f(el.dataset,el)});
document.addEventListener('change',function(e){var el=e.target.closest('[data-chg]');if(!el)return;var f=CHG[el.dataset.chg];if(f)f(el,el.dataset)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.modal){S.modal=null;S.shopperPv=null;render()}});
var hh=(location.hash||'').replace('#','');if(VIEWS[hh]){S.view=hh;S.role='cx'}
render();
})();
